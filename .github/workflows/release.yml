name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  # Typecheck, Unit- und E2E-Tests laufen exakt so wie bei jedem PR -
  # ci.yml ist die einzige Definition, hier nur wiederverwendet.
  ci:
    uses: ./.github/workflows/ci.yml

  build-linux:
    name: Build Linux (.deb)
    needs: [ci]
    if: "!contains(github.ref_name, '-win')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Native Module neu bauen
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: App bauen
        run: npx vite build

      - name: Linux .deb bauen
        run: npx electron-builder --linux deb --publish never

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            release/*.deb
            release/latest-linux.yml

  build-windows:
    name: Build Windows (.exe)
    needs: [ci]
    if: "!contains(github.ref_name, '-linux')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Native Module neu bauen
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: App bauen
        run: npx vite build

      - name: Zertifikat einrichten
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CSC_LINK_BASE64)
          [IO.File]::WriteAllBytes("movieshelf-cert.pfx", $bytes)

      - name: Windows Installer bauen
        env:
          CSC_LINK: movieshelf-cert.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  notify:
    name: Website benachrichtigen
    needs: [build-linux, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256 berechnen
        id: hashes
        run: |
          SHA256_WIN=$(find artifacts -iname "*setup*.exe" -exec sha256sum {} \; 2>/dev/null | awk '{print $1}' | head -1)
          SHA256_DEB=$(find artifacts -name "*.deb"        -exec sha256sum {} \; 2>/dev/null | awk '{print $1}' | head -1)
          echo "win=${SHA256_WIN}" >> $GITHUB_OUTPUT
          echo "deb=${SHA256_DEB}" >> $GITHUB_OUTPUT

      - name: Changelog-Abschnitt extrahieren
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Release erstellen und Assets hochladen
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.changelog.outputs.body }}
          # Plattform-Testpakete als Vorabversion kennzeichnen: electron-updater
          # liest sonst deren latest.yml als neuesten Stand.
          prerelease: ${{ contains(github.ref_name, '-linux') || contains(github.ref_name, '-win') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Plattform-Testpakete (-linux/-win) bleiben ein reines GitHub-Release:
      # Der Update-Check der App fragt movieshelf.info ab, ein Webhook von hier
      # würde die Testversion allen Plattformen anbieten — unter Windows sogar
      # mit leerer Download-Adresse, weil dieser Build gar nicht gelaufen ist.
      - name: Website benachrichtigen
        if: "!contains(github.ref_name, '-linux') && !contains(github.ref_name, '-win')"
        env:
          ASSETS_JSON: ${{ steps.release.outputs.assets }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          WEBHOOK_SECRET: ${{ secrets.DESKTOP_WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.DESKTOP_WEBHOOK_URL }}
          VERSION: ${{ github.ref_name }}
          SHA256_WIN: ${{ steps.hashes.outputs.win }}
          SHA256_DEB: ${{ steps.hashes.outputs.deb }}
        run: |
          URL_WIN=$(echo "$ASSETS_JSON" | jq -r '[.[] | select(.name | ascii_downcase | test("setup.*\\.exe$"))] | first | .browser_download_url // ""')
          URL_DEB=$(echo "$ASSETS_JSON" | jq -r '[.[] | select(.name | endswith(".deb"))]              | first | .browser_download_url // ""')
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -d "$(jq -n \
              --arg version    "$VERSION" \
              --arg url_win    "$URL_WIN" \
              --arg url_deb    "$URL_DEB" \
              --arg hash_win   "$SHA256_WIN" \
              --arg hash_deb   "$SHA256_DEB" \
              --arg changelog  "$CHANGELOG_BODY" \
              '{version: $version, download_url: $url_win, download_url_linux_deb: $url_deb, file_hash: $hash_win, file_hash_linux_deb: $hash_deb, changelog: $changelog}')"

  # winget-Einreichung direkt hier statt in winget.yml: das dort genutzte
  # release-Event feuert nie, weil das Release mit dem Standard-GITHUB_TOKEN
  # erstellt wird und solche Events absichtlich keine Workflows starten.
  # Nur Feature-Releases (Patch .0): Bugfix-Versionen werden nicht bei
  # winget eingereicht, um die winget-pkgs-Reviewer nicht zu fluten —
  # bei Bedarf per winget.yml (workflow_dispatch) manuell nachreichen.
  winget:
    name: winget einreichen
    needs: [notify]
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '.0') && !contains(github.ref_name, '-linux')
    runs-on: ubuntu-latest
    steps:
      # Fuer packaging/winget/release-notes.py und die beiden Changelogs.
      - uses: actions/checkout@v4

      # komac direkt statt vedantmgoyal9/winget-releaser — gleiche Schritte wie
      # in winget.yml, dort steht auch die Begruendung. WINGET_TOKEN braucht die
      # Scopes public_repo UND workflow.
      - name: komac installieren
        uses: cargo-bins/cargo-binstall@main
      - run: cargo-binstall komac -y

      - name: Fork mit winget-pkgs abgleichen
        run: komac sync-fork --token "$TOKEN"
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: lunasans

      - name: winget-Manifest aktualisieren & einreichen
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: lunasans
          KOMAC_CREATED_WITH: MovieShelf Release
          KOMAC_CREATED_WITH_URL: https://github.com/lunasans/movieshelf-desktop
          # Ueber env statt direkt in die Shell interpoliert: sonst koennte ein
          # praepariertes Tag beliebige Befehle im Runner ausfuehren.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          komac update 'Lunasans.MovieShelf' \
            --version "${TAG#v}" \
            --urls "https://github.com/lunasans/movieshelf-desktop/releases/download/$TAG/MovieShelf-Setup-${TAG#v}.exe" \
            --submit \
            --token "$TOKEN"

      # komac hat keinen Schalter fuer die Notizen: es zieht sie aus dem
      # GitHub-Release-Text — der ist deutsch — und schreibt sie nur ins
      # Standard-Locale, seit 1.0.0 also en-US. Darum werden sie hier je Sprache
      # nachgetragen. Bricht ab, wenn CHANGELOG.en.md den Abschnitt nicht hat.
      - name: Release-Notizen je Sprache nachtragen
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          python3 packaging/winget/release-notes.py --version "${TAG#v}"
