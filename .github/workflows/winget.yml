name: Submit to winget

# Manueller Fallback: Die reguläre winget-Einreichung läuft als Job in
# release.yml (das frühere release-Event hier feuerte nie, weil Releases mit
# dem Standard-GITHUB_TOKEN erstellt werden und solche Events absichtlich
# keine weiteren Workflows starten). Dieser Workflow dient zum Nachreichen
# einzelner Versionen, z.B. wenn der Release-Job fehlgeschlagen ist.
#
# Voraussetzungen (einmalig):
#  1. Das Paket muss in winget-pkgs schon existieren — die ERSTE Version einmalig
#     manuell einreichen (siehe packaging/winget/README.md).
#  2. Ein Fork von microsoft/winget-pkgs unter dem eigenen Konto (existiert als
#     lunasans/winget-pkgs). `komac sync-fork` zieht ihn vor jeder Einreichung
#     auf den Upstream-Stand nach.
#  3. Secret WINGET_TOKEN: ein klassischer GitHub-PAT mit den Scopes
#     "public_repo" UND "workflow". Der zweite ist zwingend: beim Nachziehen des
#     Forks kommen geaenderte Dateien unter .github/workflows/ mit, und GitHub
#     lehnt solche Ref-Updates ohne diesen Scope ab - mit der irrefuehrenden
#     Meldung "<user> does not have the correct permissions to execute
#     CreateRef/UpdateRef".

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release-Tag (z.B. v0.20.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Fuer packaging/winget/release-notes.py und die beiden Changelogs.
      # Der Tag, nicht der Standardbranch: die Notizen sollen aus dem Changelog
      # zum eingereichten Stand kommen.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}

      # komac direkt statt vedantmgoyal9/winget-releaser: die Action scheitert
      # reproduzierbar an "lunasans does not have the correct permissions to
      # execute CreateRef/UpdateRef", obwohl dasselbe Secret im selben Runner
      # nachweislich Branches im Fork anlegen darf (per REST und per GraphQL).
      # komac zieht dort offenbar den ambienten GITHUB_TOKEN des Workflows statt
      # des uebergebenen Tokens. Hier wird es mit --token explizit uebergeben.
      - name: komac installieren
        uses: cargo-bins/cargo-binstall@main
      - run: cargo-binstall komac -y

      - name: Fork mit winget-pkgs abgleichen
        run: komac sync-fork --token "$TOKEN"
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: lunasans

      - name: winget-Manifest aktualisieren & einreichen
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: lunasans
          KOMAC_CREATED_WITH: MovieShelf Release
          KOMAC_CREATED_WITH_URL: https://github.com/lunasans/movieshelf-desktop
        run: |
          TAG='${{ inputs.release-tag }}'
          komac update 'Lunasans.MovieShelf' \
            --version "${TAG#v}" \
            --urls "https://github.com/lunasans/movieshelf-desktop/releases/download/$TAG/MovieShelf-Setup-${TAG#v}.exe" \
            --submit \
            --token "$TOKEN"

      # Siehe release.yml: komac schreibt die Notizen nur ins Standard-Locale
      # und zieht sie aus dem deutschen Release-Text.
      - name: Release-Notizen je Sprache nachtragen
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          TAG='${{ inputs.release-tag }}'
          python3 packaging/winget/release-notes.py --version "${TAG#v}"
