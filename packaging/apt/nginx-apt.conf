# apt.movieshelf.info – statische Auslieferung der Paketquelle.
# TLS-Teil ergänzt certbot beim ersten Lauf.
server {
    listen 80;
    listen [::]:80;
    server_name apt.movieshelf.info;

    root /srv/apt/public;
    autoindex off;

    access_log /var/log/nginx/apt.access.log;
    error_log  /var/log/nginx/apt.error.log;

    # Der Schlüssel liegt direkt im Wurzelverzeichnis, die Paketquelle darunter.
    location = /movieshelf.gpg {
        default_type application/pgp-keys;
        add_header Cache-Control "public, max-age=86400";
    }

    # InRelease/Release beschreiben den aktuellen Stand – kurz cachen, sonst
    # sieht apt nach einer Veröffentlichung minutenlang die alte Version.
    location ~* /(InRelease|Release|Release\.gpg|Packages(\.gz|\.xz)?)$ {
        root /srv/apt/public/repo;
        add_header Cache-Control "public, max-age=300";
    }

    # Die .deb-Dateien selbst ändern sich unter einem Namen nie.
    location ~* \.deb$ {
        root /srv/apt/public/repo;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /srv/apt/public/repo;
        try_files $uri $uri/ =404;
    }
}
