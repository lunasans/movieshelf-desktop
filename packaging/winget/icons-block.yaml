# Zum Einfuegen in Lunasans.MovieShelf.locale.en-US.yaml im winget-pkgs-PR.
# Voraussetzung: ManifestVersion dort auf mindestens 1.6.0 setzen.
#
# <TAG> durch das Release-Tag ersetzen, das packaging/winget/icon-256.png
# bereits enthaelt (nicht "main" verwenden - Raw-URLs auf main aendern sich).
# Passt der SHA256 nicht zur ausgelieferten Datei, schlaegt die Validierung fehl.

Icons:
  - IconUrl: https://raw.githubusercontent.com/lunasans/movieshelf-desktop/<TAG>/packaging/winget/icon-256.png
    IconFileType: png
    IconResolution: '256x256'
    IconTheme: default
    IconSha256: 48E663B4E048E1BB825ABA5B4A234F248BA1DA5B9911272837BBB34D3380E364
