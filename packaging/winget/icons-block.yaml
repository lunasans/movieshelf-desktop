# ACHTUNG: Derzeit NICHT einreichbar. Die winget-Validierung lehnt das Feld ab:
#   [Error] FieldRequireVerifiedPublisher: Field usage requires verified publishers. (Icons)
# Gescheitert beim Release 0.24.0 (winget-pkgs PR #411233), obwohl URL, Größe
# und Hash korrekt sind. Details in README.md.
#
# Falls Lunasans einmal verifizierter Publisher ist: einfuegen in
# Lunasans.MovieShelf.locale.de-DE.yaml (de-DE ist das defaultLocale).
# ManifestVersion nicht anfassen, komac schreibt bereits 1.12.0.
#
# Die URL zeigt fest auf v0.24.0 - dieses Tag enthält packaging/winget/icon-256.png.
# Nicht auf "main" umstellen, Raw-URLs auf main ändern sich. Wird das Icon neu
# erzeugt, müssen Tag und IconSha256 gemeinsam nachgezogen werden, sonst schlägt
# die Validierung in winget-pkgs fehl.

Icons:
  - IconUrl: https://raw.githubusercontent.com/lunasans/movieshelf-desktop/v0.24.0/packaging/winget/icon-256.png
    IconFileType: png
    IconResolution: '256x256'
    IconTheme: default
    IconSha256: 48E663B4E048E1BB825ABA5B4A234F248BA1DA5B9911272837BBB34D3380E364
