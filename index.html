<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Die App laeuft unter file://. Chromium sendet diesen Origin als Referer mit,
      wodurch der Hotlink-Schutz der Medien-Domain die Bilder mit 403 blockt.
      Ohne Referer liefert der Server normal aus.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>MovieShelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
